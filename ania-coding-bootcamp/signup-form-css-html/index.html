<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Signup Modal</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <div class="auth-modal">
            <div class="close-icon">ⓧ</div>
            <h2>Sign Up</h2>
            <p>By signing up you agree to out terms and conditions.
                Learn about out Privacy Policy before clicking submit.
            </p>

            <form>
                <input 
                    type="text"
                    id="username"
                    name="text"
                    placeholder="username"
                />
                <input 
                    type="password"
                    id="password"
                    name="password"
                    placeholder="password"
                />
                <input 
                    type="password"
                    id="password-check"
                    name="password-check"
                    placeholder="confirm password"
                />
                <label for="tandc">
                    <input 
                    type="checkbox"
                    id="tandc"
                    name="tandc"
                />
                I agree to the terms and conditions.
                </label>
                
                <input 
                    type="submit" 
                    class="form-button"
                />

                <hr/>

                <h2>Download the app!</h2>
                
                <div class="link-container">
                    <a href="http://play.google.com/store">
                        <img 
                            src="images/google-play-download.png" 
                            alt="Google Play icon"
                        />
                    </a>
                    <a href="https://www.apple.com/store">
                        <img 
                            src="images/app-store-download.png" 
                            alt="Apple Store icon"
                        />
                    </a>
                </div>
            </form>
        </div>
        

        
    </body>
</html>
